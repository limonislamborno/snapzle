<div style="max-width: 400px; margin: 24px auto; background: #ffffff; border-radius: 20px; border: 1px solid #F1F5F9; padding: 36px 28px; text-align: center; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  
  <div style="margin: 0 auto 16px; width: 64px; height: 64px;">
    <svg width="64" height="64" viewBox="0 0 200 200" style="display: block; border-radius: 16px; box-shadow: 0 6px 16px rgba(217, 72, 15, 0.18);">
      <rect width="200" height="200" rx="45" fill="#D9480F"/>
      <path d="M45 62H80C68 28 128 28 116 62H152V98C184 86 184 144 152 132V166H45Z" fill="#FAF5EC"/>
      <circle cx="77" cy="102" r="9" fill="#D9480F"/>
      <path d="M110 103Q122 90 134 103" fill="none" stroke="#D9480F" stroke-width="7" stroke-linecap="round"/>
      <path d="M72 126Q100 160 128 126Z" fill="#D9480F"/>
    </svg>
  </div>

  <div style="font-size: 11px; font-weight: 700; color: #EA580C; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px;">
    SNAPZLE
  </div>

  <h2 style="margin: 0 0 8px; font-size: 21px; font-weight: 700; color: #1E293B; letter-spacing: -0.3px;">
    Verification Code
  </h2>
  
  <p style="margin: 0 0 22px; font-size: 14px; color: #64748B; line-height: 1.5;">
    Enter this 6-digit code in the app to continue:
  </p>

  <div style="background: #FFF7ED; border: 1px solid #FFEDD5; border-radius: 14px; padding: 16px 20px; margin: 0 auto 18px; max-width: 260px;">
    <div style="font-size: 32px; font-weight: 800; color: #EA580C; letter-spacing: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; line-height: 1; white-space: nowrap; display: inline-block;">
      {{ .Token }}
    </div>
  </div>

  <p style="margin: 0 0 22px; font-size: 12px; color: #9A3412;">
    ⏱️ Expires in 60 minutes
  </p>

  <div style="border-top: 1px solid #F1F5F9; padding-top: 16px;">
    <p style="margin: 0; font-size: 12px; color: #94A3B8;">
      If you didn't request this code, you can safely ignore this email.
    </p>
  </div>

</div>
