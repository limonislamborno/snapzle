<div style="max-width: 440px; margin: 20px auto; background: #ffffff; border-radius: 24px; border: 1px solid #E2E8F0; overflow: hidden; box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.1); text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <!-- Top Brand Gradient Bar -->
  <div style="height: 6px; background: linear-gradient(90deg, #EA580C 0%, #F59E0B 50%, #7C3AED 100%);"></div>

  <div style="padding: 36px 28px 28px;">
    <!-- Happy Piece Icon (#10) - Pure Inline SVG -->
    <div style="margin: 0 auto 16px; width: 76px; height: 76px;">
      <svg width="76" height="76" viewBox="0 0 200 200" style="display: block; border-radius: 19px; box-shadow: 0 12px 28px rgba(217, 72, 15, 0.28);">
        <rect width="200" height="200" rx="45" fill="#D9480F"/>
        <path d="M45 62H80C68 28 128 28 116 62H152V98C184 86 184 144 152 132V166H45Z" fill="#FAF5EC"/>
        <circle cx="77" cy="102" r="9" fill="#D9480F"/>
        <path d="M110 103Q122 90 134 103" fill="none" stroke="#D9480F" stroke-width="7" stroke-linecap="round"/>
        <path d="M72 126Q100 160 128 126Z" fill="#D9480F"/>
      </svg>
    </div>

    <!-- Brand Badge -->
    <div style="display: inline-block; padding: 4px 14px; background: #FFF7ED; border: 1px solid #FFEDD5; border-radius: 20px; font-size: 11px; font-weight: 800; color: #EA580C; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 12px;">
      SNAPZLE
    </div>

    <h1 style="margin: 0 0 10px; font-size: 24px; font-weight: 800; color: #0F172A; letter-spacing: -0.5px; line-height: 1.25;">
      Your Login Link
    </h1>
    
    <p style="margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: #475569;">
      Click the button below to instantly sign in to your Snapzle account:
    </p>

    <!-- Magic Link Button -->
    <div style="margin: 0 auto 24px;">
      <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: linear-gradient(135deg, #EA580C 0%, #C2410C 100%); color: #ffffff; text-decoration: none; padding: 14px 32px; border-radius: 14px; font-size: 15px; font-weight: 700; box-shadow: 0 8px 20px rgba(234, 88, 12, 0.35);">
        Sign In to Snapzle →
      </a>
    </div>

    <!-- Expiry Pill -->
    <div style="display: inline-block; padding: 6px 14px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 20px; font-size: 12px; font-weight: 600; color: #64748B; margin-bottom: 24px;">
      ⏱️ Link expires in 60 minutes
    </div>

    <!-- Footer Divider -->
    <div style="border-top: 1px solid #F1F5F9; padding-top: 20px;">
      <p style="margin: 0 0 6px; font-size: 12px; color: #94A3B8; line-height: 1.5;">
        🔒 If you did not request this login link, you can safely ignore this email.
      </p>
      <p style="margin: 0; font-size: 11px; font-weight: 600; color: #CBD5E1; letter-spacing: 0.5px;">
        SNAPZLE • PHOTO-POWERED PUZZLE BATTLES
      </p>
    </div>
  </div>
</div>
